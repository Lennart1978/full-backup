site_name: FULL_BACKUP
site_description: Automatisierte System- und HOME-Backups für Linux
site_author: Lennart
site_url: https://full-back.pages.dev/

repo_name: Lennart1978/full-back
repo_url: https://github.com/Lennart1978/full-back

docs_dir: docs
site_dir: site

copyright: Copyright &copy; 2026 FULL_BACKUP

theme:
  name: material
  language: de

  icon:
    logo: material/harddisk
    repo: fontawesome/brands/github

  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Helles Design aktivieren

    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Dunkles Design aktivieren

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.follow

nav:
  - Startseite: index.md
  - Installation: installation.md
  - Konfiguration: configuration.md
  - Verwendung: usage.md
  - Downloads: downloads.md

plugins:
  - search:
      lang: de

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      linenums: true
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
